version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-change_this_strong_password_123!}
      POSTGRES_DB: tickly_db
      APP_DB_USER: tickly_app
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:-tickly_app_secure_pass_456!}
      APP_DB_SCHEMA: tickly_app
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=tickly_db;Username=tickly_app;Password=${DB_APP_PASSWORD:-tickly_app_secure_pass_456!};SearchPath=tickly_app,public
      - Jwt__Key=${JWT_SECRET_KEY:-please_generate_a_secure_random_key_minimum_32_chars}
      - InitialSuperAdmin__Password=${ADMIN_PASSWORD:-ChangeThisAdminPassword123!}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
